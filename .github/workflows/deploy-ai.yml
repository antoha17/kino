# Выкладка серверной функции `ai` в Supabase при каждом её изменении.
# Нужен секрет репозитория SUPABASE_ACCESS_TOKEN (Settings → Secrets and variables → Actions).
# Запустить вручную: вкладка Actions → «Выкладка функции ИИ» → Run workflow.
name: Выкладка функции ИИ

on:
  push:
    branches: [main]
    paths: ["supabase/functions/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Выложить функцию ai
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Нет секрета SUPABASE_ACCESS_TOKEN. Добавьте его: Settings → Secrets and variables → Actions."
            exit 1
          fi
          # Проверку входа делает сама функция (auth.getUser), поэтому --no-verify-jwt.
          supabase functions deploy ai --project-ref ipqcqexoymvfoxejypyr --no-verify-jwt --yes
